<!DOCTYPE html>
<!--
   /\_/\  
  ( o.o )  < Мяу! Ты заглянул в исходный код!
   > ^ <     Тут нет майнеров и слежки, только быстрый переход в мессенджеры,
             чтобы не сохранять лишние номера в записную книжку.
             Любишь смотреть код? Другие мои проекты: https://github.com
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Телепорт в мессенджер 🚀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Привет, исследователь кода! Другие проекты: https://github.com -->
  <div class="card" id="card">
    <div class="fill-bg" id="fillBg"></div>
    <div class="card-content">
      <div class="emoji" id="icon" title="Потыкай меня">🛸</div>
      <h1 id="title">Запускаем телепорт...</h1>
      <p id="desc">Перекидываем номер прямо в приложение мессенджера без лишних кликов.</p>
      <div class="dossier" id="dossier"></div>
      <div class="btn-wrap">
        <a id="btn" class="btn" href="#">Открыть чат</a>
      </div>
      <div class="secret" id="secret">
        Сделано с душой ✨ · <a href="https://github.com" target="_blank">GitHub</a>
      </div>
    </div>
  </div>

  <script>
    console.log('%c🛸 Секретный шлюз! Другие проекты: https://github.com', 'color:#38bdf8;font-size:14px;font-weight:bold;');

    const p = new URLSearchParams(location.search);
    const tg = p.get('tg'), wa = p.get('wa');
    const card = document.getElementById('card'), btn = document.getElementById('btn');
    const title = document.getElementById('title'), desc = document.getElementById('desc');
    const icon = document.getElementById('icon'), dossier = document.getElementById('dossier');
    const secret = document.getElementById('secret'), fillBg = document.getElementById('fillBg');

    function spawnCoin(x, y, text) {
      const el = document.createElement('div');
      el.className = 'coin';
      el.textContent = text || '+1 🪙';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    if (tg) {
      const url = 'tg://resolve?phone=' + tg;
      icon.textContent = '✈️';
      title.textContent = 'Летим в Telegram!';
      desc.textContent = 'Номер +' + tg + '. Если приложение не открылось — жми кнопку:';
      btn.textContent = 'Открыть в Telegram';
      btn.href = url;
      location.href = url;
    } else if (wa) {
      const url = 'whatsapp://send?phone=' + wa;
      icon.textContent = '💬';
      title.textContent = 'Прыгаем в WhatsApp!';
      desc.textContent = 'Номер +' + wa + '. Если чат не открылся — жми кнопку:';
      btn.textContent = 'Открыть в WhatsApp';
      btn.classList.add('btn-wa');
      btn.href = url;
      location.href = url;
    } else {
      let dodges = 0, stage = 'dodge', coins = 0;
      const maxDodges = 3, goal = 15;
      const dodgePhrases = ['Не поймаешь! 😜', 'Почти! 🏃‍♂️', 'Ой, мимо! ⚡'];

      icon.textContent = '🕵️‍♂️';
      title.textContent = 'Секретный шлюз';
      desc.textContent = 'Эта страница умеет телепортировать номера, но сейчас в ссылке пусто.';
      btn.textContent = 'Не нажимать!';

      const dodgeAction = (e) => {
        if (dodges < maxDodges) {
          if (e) e.preventDefault();
          btn.style.transform = 'translate(' + ((Math.random() - 0.5) * 140) + 'px,' + ((Math.random() - 0.5) * 50) + 'px)';
          btn.textContent = dodgePhrases[dodges++];
        }
      };

      btn.addEventListener('mouseenter', dodgeAction);
      btn.addEventListener('touchstart', (e) => { if (dodges < maxDodges) { e.preventDefault(); dodgeAction(); } }, { passive: false });

      btn.onclick = async (e) => {
        e.preventDefault();
        if (dodges < maxDodges) { dodgeAction(); return; }
        btn.style.transform = 'translate(0,0)';

        if (stage === 'dodge') {
          stage = 'fbi';
          card.classList.add('alert');
          icon.textContent = '🚨';
          title.textContent = 'Ну всё, ты доигрался!';
          desc.textContent = 'Передаю твои данные на сервер fbi.gov...';
          btn.classList.add('btn-danger');
          btn.textContent = 'Отмена! Отмена! 😱';

          const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Неизвестно';
          dossier.style.display = 'block';
          dossier.innerHTML = '> IP-адрес: <b>определяю...</b><br>> Система: ' + (navigator.platform || 'OS') + ' (' + (navigator.language || 'ru') + ')<br>> Экран: ' + screen.width + 'x' + screen.height + '<br>> Часовой пояс: ' + tz + '<br>> Статус: <b>Отправка пакета...</b>';

          try {
            const res = await fetch('https://ipify.org');
            const data = await res.json();
            if (stage === 'fbi') dossier.innerHTML = dossier.innerHTML.replace('определяю...', data.ip);
          } catch (_) {
            if (stage === 'fbi') dossier.innerHTML = dossier.innerHTML.replace('определяю...', '127.0.0.1 (скрыт)');
          }
          return;
        }

        if (stage === 'fbi') {
          stage = 'hamster';
          card.classList.remove('alert');
          dossier.style.display = 'none';
          btn.classList.remove('btn-danger');
          btn.classList.add('btn-hamster');
        }

        coins++;
        spawnCoin(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2);
        fillBg.style.height = Math.min((coins / goal) * 100, 100) + '%';

        if (coins === 1) {
          icon.textContent = '🐹';
          title.textContent = 'О, а ты ловкий и смелый!';
          desc.textContent = 'Ладно, шучу, данные никуда не ушли 😄 Раз поймал — тапай хомяка!';
          btn.textContent = 'Тапать! (1 / ' + goal + ') 🪙';
        } else if (coins < goal) {
          icon.style.transform = 'scale(' + (1 + (coins % 2) * 0.15) + ')';
          btn.textContent = 'Тапать! (' + coins + ' / ' + goal + ') 🪙';
        } else if (coins === goal) {
          icon.textContent = '👑';
          title.textContent = 'Хранилище заполнено!';
          desc.textContent = 'Поздравляю, ты прошёл секретную страницу телепорта.';
          btn.textContent = 'Листинг пройден 🎉';
          secret.innerHTML = 'Пасхалка найдена: код 7355608 🏆 · <a href="https://github.com" target="_blank">GitHub</a>';
          for (let i = 0; i < 18; i++) {
            setTimeout(() => spawnCoin(Math.random() * innerWidth, innerHeight * 0.7, i % 2 ? '✨' : '🪙'), i * 60);
          }
        } else {
          btn.textContent = 'Натапано: ' + coins + ' 🪙';
        }
      };
    }

    let iconClicks = 0;
    icon.onclick = () => {
      if (++iconClicks === 5) {
        secret.innerHTML = '🚀 Турбо-режим активирован! · <a href="https://github.com" target="_blank">GitHub</a>';
        document.body.style.background = '#1e1b4b';
      }
    };
  </script>
</body>
</html>
